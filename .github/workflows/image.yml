name: image

# Deja en GHCR, privada, la imagen de servidor (linux/amd64, la del VPS) de este árbol de archivos. Si ya existe, la
# reutiliza sin compilar; si no, la compila UNA vez y la sube. Devuelve su digest: staging y producción la bajan por
# digest con pintech-deploy (.docker/server/). El servidor nunca compila.
#
# Dos etiquetas por imagen:
# - `sha-<commit>`: el commit exacto que se compiló.
# - `tree-<árbol>`: el hash del árbol de archivos (`git rev-parse HEAD^{tree}`). El merge de `develop` a `main` crea
#   otro commit, pero si `main` no trae cambios propios el árbol es idéntico: así se promueve a producción el mismo
#   digest que se probó en staging, sin recompilar.
#
# Lo llama el workflow `cd` después de las pruebas. Ni escanear ni desplegar son parte de este workflow.
on:
  workflow_call:
    outputs:
      digest:
        description: Digest (sha256:…) de la imagen de este árbol.
        value: ${{ jobs.publish.outputs.digest }}
      built:
        description: "'true' si hubo que compilarla; 'false' si ya existía."
        value: ${{ jobs.publish.outputs.built }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: imagen de servidor
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    # Un grupo por commit: cada push deja su imagen, y un push nuevo no cancela la de otro que esté en cola.
    concurrency:
      group: image-${{ github.sha }}
      cancel-in-progress: false
    outputs:
      digest: ${{ steps.existing.outputs.digest || steps.push.outputs.digest }}
      built: ${{ steps.existing.outputs.digest == '' }}
    env:
      IMAGE: ghcr.io/pintech-colombia/pintech-os
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Etiquetas
        id: tags
        run: |
          echo "sha=sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "tree=tree-$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Iniciar sesión en GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # Solo «no existe» lleva a compilar. Cualquier otro error (permisos, red) detiene el job: si no, una falla de GHCR
      # en `main` parecería un hotfix.
      - name: Buscar la imagen de este árbol
        id: existing
        env:
          TREE_TAG: ${{ steps.tags.outputs.tree }}
        run: |
          if output="$(docker buildx imagetools inspect "$IMAGE:$TREE_TAG" --format '{{.Manifest.Digest}}' 2>&1)"; then
            [[ "$output" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Digest inesperado: $output"; exit 1; }
            echo "Ya existe $IMAGE:$TREE_TAG → $output: no se compila."
            echo "digest=$output" >> "$GITHUB_OUTPUT"
          elif grep -q 'not found' <<<"$output"; then
            echo "No existe $IMAGE:$TREE_TAG: se compila."
          else
            echo "No se pudo consultar GHCR: $output"
            exit 1
          fi

      - name: Compilar
        if: steps.existing.outputs.digest == ''
        env:
          SHA_TAG: ${{ steps.tags.outputs.sha }}
          TREE_TAG: ${{ steps.tags.outputs.tree }}
        run: >
          docker build --platform linux/amd64 -f .docker/production/app/Dockerfile
          --label "org.opencontainers.image.revision=$GITHUB_SHA"
          -t "$IMAGE:$SHA_TAG" -t "$IMAGE:$TREE_TAG" .

      - name: Subir
        id: push
        if: steps.existing.outputs.digest == ''
        env:
          SHA_TAG: ${{ steps.tags.outputs.sha }}
        run: |
          docker push --all-tags "$IMAGE"
          digest="$(docker image inspect "$IMAGE:$SHA_TAG" --format '{{range .RepoDigests}}{{println .}}{{end}}' \
            | grep "^$IMAGE@" | head -n 1 | cut -d@ -f2)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "No se obtuvo el digest de la imagen subida"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Resumen
        env:
          DIGEST: ${{ steps.existing.outputs.digest || steps.push.outputs.digest }}
          ORIGIN: ${{ steps.existing.outputs.digest != '' && 'ya existía, no se compiló' || 'compilada en esta corrida' }}
          TREE_TAG: ${{ steps.tags.outputs.tree }}
        run: |
          {
            echo "### Imagen de servidor"
            echo
            echo "- Digest: \`$DIGEST\`"
            echo "- Etiqueta: \`$TREE_TAG\` ($ORIGIN)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cerrar sesión en GHCR
        if: always()
        run: docker logout ghcr.io
