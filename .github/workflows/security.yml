name: security

# Escanea con Trivy lo que de verdad se despliega: la imagen de servidor compilada (PHP, Nginx, paquetes de Debian y
# binarios) y los lockfiles. `composer audit` y `npm audit` (workflow `quality`) solo ven paquetes: no ven el PHP
# ni el sistema de la imagen, y por eso un aviso crítico de PHP pasó sin que el CI lo notara.
#
# Antes de fusionar, corre en cada PR. Después de fusionar, el que escanea es `cd`, sobre el digest exacto que se va a
# desplegar. Corre también todos los días: un aviso nuevo sobre algo que ya estaba en `develop` pone este job en rojo y
# GitHub avisa por correo, aunque nadie haya hecho push.
on:
  pull_request:
    branches:
      - develop
      - main
  schedule:
    # 06:00 en Colombia (11:00 UTC).
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  images:
    name: trivy (imágenes)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compilar la imagen de servidor
        run: docker build -f .docker/production/app/Dockerfile -t pintech/server:ci .

      - name: Escanear la imagen de servidor
        uses: ./.github/actions/trivy
        with:
          image: pintech/server:ci

  lockfiles:
    name: trivy (lockfiles)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Escanear composer.lock y package-lock.json
        uses: ./.github/actions/trivy
